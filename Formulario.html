  <h1>Contacto</h1>

  <section class="contacto">



    <form action="" novalidate onsubmit="return recarga(event)">
   
      <div class="item">
        <label for="username">Nombre:</label>
        <input type="text" id="username" name="username"placeholder="EJ: Lourdes"  >
      </div>

      <div class="item"> 
     <label for="telefono ">Teléfono:</label>
      <input type="text" id="telefono" name="telefono" placeholder="EJ: 2664707070">
      </div>

      <div class="item">
        <label for="email">Correo electrónico:</label>
        <input type="text" id="email" name="email" placeholder="EJ: lourdes@gmail.com" >
      </div>

      <div class="item">
     <label for="mensaje ">Mensaje:</label>
    <textarea id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
      </div>


      <div class="center">
        <button type="submit">Enviar</button>
      </div>

      <div id="mensaje-final" class="mensaje-final"></div>
    </form>

    

<!--Enlazado a js-------------------------------------------------------------------------------------------------------------------------------->
