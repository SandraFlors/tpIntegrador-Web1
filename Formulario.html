  <h1>Contacto</h1>

  <section class="contacto">



   <form action="" novalidate onsubmit="return recarga(event)">
    <h2>Mis datos.</h2>
    <div class="item">
      <label for="username">*Nombre de usuario:</label>
      <input type="text" id="username" name="username">
    </div>
    <div class="item">
      <label for="birthday">Fecha de cumpleaños:</label>
      <input type="date" id="birthday" name="birthday" min="1900-01-01" max="2024-12-31">
    </div>
    <div class="item">
      <label for="email">*Correo electrónico:</label>
      <input type="text" id="email" name="email">
    </div>
    <div class="item">
      <label for="password">*Contraseña:</label>
      <input type="password" id="password" name="password" >
    </div>
    <div class="item">
      <label for="confirm-password">*Confirmar contraseña:</label>
      <input type="password" id="confirm-password" name="confirm-password" >
    </div>
    <div class="item row">
      <input type="checkbox" id="terms" name="terms" >
      <label for="terms">*Acepto términos y condiciones</label>
    </div>
    <div class="center">
      <button type="submit">Registrarse</button>
    </div>
   </form>
 

      <script src="js/validacion.js"></script> <!--Enlazado a js--------------------------------------------------------------------------------------->

    <div class="info-contacto">
      <p>📧 PedaleaConmigo@gmail.com</p>

      </div>
    </div>
  </section>
